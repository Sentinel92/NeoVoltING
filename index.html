<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NEOVOLT SEC - Ingeniero Eléctrico & Automatización Industrial</title>
    <meta name="description" content="Calculadora, Cubicador de Planos IA, Cotizador y Declarador TE1 SEC para Ingenieros en Electricidad y Automatización Industrial" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEOVOLT SEC" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-fuchsia-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('⚡ Service Worker NEOVOLT PWA v2 activo:', reg.scope);

            // Register BackgroundSync if supported
            if ('SyncManager' in window) {
              reg.sync.register('firebase-cloud-sync').catch(function(err) {
                console.log('Sync registration error:', err);
              });
            }

            // Check for Service Worker updates
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('Nueva versión de Service Worker lista para activarse.');
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          }).catch((err) => {
            console.log('Fallo registro Service Worker:', err);
          });
        });

        // Trigger sync check when network comes back online
        window.addEventListener('online', () => {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'CHECK_ONLINE_SYNC' });
          }
        });
      }
    </script>
  </body>
</html>
